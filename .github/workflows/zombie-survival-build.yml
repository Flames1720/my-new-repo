name: Zombie survival release checks

on:
  push:
    branches:
      - feature/zombie-survival-world-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Production build
        run: npm run build
