name: Island Outbreak Visual Audit

on:
  push:
    branches: [feature/zombie-survival-world-v2]
    paths:
      - 'index.html'
      - 'src/**'
      - 'tools/visual_audit.py'
      - '.github/workflows/island-visual-audit.yml'
  workflow_dispatch:

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/island-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/island-preview.log
          exit 1
      - name: Capture all lobby and settings screens
        run: python tools/visual_audit.py --url http://127.0.0.1:4173 --out visual-audit
      - name: Upload screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-visual-audit
          path: visual-audit/
          retention-days: 14
