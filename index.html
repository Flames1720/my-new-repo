<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#10151b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>World Prototype — Core</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div id="brand">WORLD <span>CORE</span></div><div id="compass">N</div>
      <button id="fullscreenBtn" aria-label="Toggle fullscreen">⛶</button><button id="mapBtn" aria-label="Open world map">MAP</button>
      <div id="status">Generating world…</div>
      <div id="target" aria-hidden="true">✚</div>
      <div id="prompt"></div>
      <div id="controls">WASD / arrows · drag to look · wheel to zoom · Space = jump · Shift = sprint · F = first person · C = third person</div>
    </div>
    <div id="mapOverlay"><button id="mapClose">CLOSE</button><div id="mapTitle">WORLD MAP <span>DISCOVERED WORLD</span></div><canvas id="mapCanvas"></canvas><div id="mapLegend">■ HOME &nbsp; ● YOU &nbsp; Roads &nbsp; Water &nbsp; Terrain</div></div><div id="touch">
      <div id="stick"><div id="knob"></div></div>
      <div id="lookZone"></div>
      <div class="actions">
        <button id="modeBtn">FPP</button>
        <button id="runBtn">WALK</button>
        <button id="jumpBtn">JUMP</button>
        <button id="interactBtn">USE</button>
      </div>
    </div>
    <div id="orientation">Rotate your device to landscape to play.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
